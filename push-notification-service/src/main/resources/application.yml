spring:
  application:
    name: push-notification-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: push-sender
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.acme.chat.domain.PushPayload
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.acme.chat.domain
    producer:        # used by @RetryableTopic to forward to retry/DLT topics
      acks: all
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
push:
  simulate-failure-rate: ${PUSH_FAIL_RATE:0.0}   # 0..1, set e.g. 0.5 to exercise retries and the DLT
